stages:
  - test
  - build
  - deploy

variables:
  POSTGRES_DB: clinic_booking_test
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DB_NAME: clinic_booking_test
  DB_USER: postgres
  DB_PASSWORD: postgres
  DB_HOST: postgres
  DB_PORT: "5432"
  SECRET_KEY: ci-test-secret-key
  # AWS variables — set these in GitLab CI/CD Settings > Variables
  # AWS_ACCESS_KEY_ID: (set in GitLab)
  # AWS_SECRET_ACCESS_KEY: (set in GitLab)
  # AWS_DEFAULT_REGION: us-east-1
  # ECR_REGISTRY: <account-id>.dkr.ecr.<region>.amazonaws.com
  # ECR_REPOSITORY: clinic-booking
  # ECS_CLUSTER: clinic-booking-cluster
  # ECS_SERVICE: clinic-booking-service
  # ECS_TASK_DEFINITION: clinic-booking-task

# ---------------------------------------------------------------------------
# Stage 1: Test
# ---------------------------------------------------------------------------
test:
  stage: test
  image: python:3.12-slim
  services:
    - name: postgres:15
      alias: postgres
  before_script:
    - apt-get update && apt-get install -y libpq-dev gcc
    - pip install -r requirements.txt
  script:
    - python manage.py migrate
    - pytest --cov=appointments/services --cov-fail-under=80
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

# ---------------------------------------------------------------------------
# Stage 2: Build Docker image and push to ECR
# ---------------------------------------------------------------------------
build:
  stage: build
  image: docker:24.0
  services:
    - docker:24.0-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_DEFAULT_REGION |
      docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA .
    - docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA
        $ECR_REGISTRY/$ECR_REPOSITORY:latest
    - docker push $ECR_REGISTRY/$ECR_REPOSITORY:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ---------------------------------------------------------------------------
# Stage 3: Deploy to ECS Fargate
# ---------------------------------------------------------------------------
deploy:
  stage: deploy
  image: registry.gitlab.com/gitlab-org/cloud-deploy/aws-base:latest
  script:
    # Update ECS service to force a new deployment with the latest image
    - aws ecs update-service
        --cluster $ECS_CLUSTER
        --service $ECS_SERVICE
        --force-new-deployment
        --region $AWS_DEFAULT_REGION
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
  environment:
    name: production
    url: https://your-app-domain.com
